name: 데이터 갱신

on:
  schedule:
    - cron: "17 */2 * * *"   # 2시간마다 (GitHub 혼잡 시 조금 늦을 수 있음)
  workflow_dispatch: {}       # Actions 탭의 Run workflow 버튼
  push:
    branches: [main]          # config.json 등을 고치면 바로 반영

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 넥슨 API 조회
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          BOSS_SHEET_CSV: ${{ vars.BOSS_SHEET_CSV }}
        run: node scripts/update.mjs

      - name: 기록 저장 (커밋)
        run: |
          git config user.name "maple-bot"
          git config user.email "maple-bot@users.noreply.github.com"
          git add data/data.json
          if ! git diff --cached --quiet; then
            git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%m-%d %H:%M')"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - name: 사이트 파일 준비
        run: |
          mkdir _site
          cp -r index.html style.css app.js config.json data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
