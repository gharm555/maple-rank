name: Cloudflare 배포

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: 설정 확인
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          FRIEND_CODE: ${{ secrets.FRIEND_CODE }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "$NEXON_API_KEY" ] && missing="$missing NEXON_API_KEY"
          [ -z "$FRIEND_CODE" ] && missing="$missing FRIEND_CODE"
          if [ -n "$missing" ]; then echo "::error::GitHub Secrets에 다음 값이 없어요:$missing"; exit 1; fi

      - name: D1 데이터베이스 준비 (없으면 생성)
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="maple-rank") | .uuid')
          if [ -z "$id" ]; then
            npx wrangler d1 create maple-rank
            id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="maple-rank") | .uuid')
          fi
          echo "D1: $id"
          sed -i "s/__D1_ID__/$id/" wrangler.toml

      - name: DB 구조 업데이트
        run: npx wrangler d1 migrations apply maple-rank --remote

      - name: 배포
        run: npx wrangler deploy

      - name: 비밀값 등록
        env:
          NEXON_API_KEY: ${{ secrets.NEXON_API_KEY }}
          FRIEND_CODE: ${{ secrets.FRIEND_CODE }}
        run: |
          printf '%s' "$NEXON_API_KEY" | npx wrangler secret put NEXON_API_KEY
          printf '%s' "$FRIEND_CODE" | npx wrangler secret put FRIEND_CODE
